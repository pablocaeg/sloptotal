services:
  sloptotal:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      # Persist downloaded models across container restarts
      - sloptotal-models:/app/models
      - sloptotal-data:/app/data
    environment:
      - HF_HOME=/app/models

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      start_period: 10m
      retries: 3

    restart: unless-stopped

  # NVIDIA GPU: this image installs CPU-only PyTorch (requirements.txt), so
  # reserving a GPU here would not move the models to it. Run from source with
  # a CUDA build of torch instead: README.md, "Configuration", "NVIDIA GPU".

volumes:
  sloptotal-models:
  sloptotal-data:
