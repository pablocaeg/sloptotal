services:
  sloptotal:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      # Persist downloaded models across container restarts
      - sloptotal-models:/app/models
      - sloptotal-data:/app/data
    environment:
      - HF_HOME=/app/models

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      start_period: 10m
      retries: 3

    restart: unless-stopped

  # Uncomment for NVIDIA GPU support:
  # sloptotal-gpu:
  #   build: .
  #   ports:
  #     - "8000:8000"
  #   volumes:
  #     - sloptotal-models:/app/models
