<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SlopTotal{% endblock %}</title>
    <meta name="description" content="{% block meta_description %}Self-hosted AI text detector. {{ engine_count }} open detection engines run on this server; nothing is sent to third parties.{% endblock %}">
    <meta name="theme-color" content="#101f4d" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0e1a3e" media="(prefers-color-scheme: dark)">
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <meta name="robots" content="noindex">
    <link rel="preload" href="/static/fonts/ibm-plex-sans.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/static/fonts/fonts.css">
    <link rel="stylesheet" href="/static/css/tokens.css">
    <link rel="stylesheet" href="/static/css/system.css">
    <link rel="stylesheet" href="/static/css/app.css">
</head>
<body class="st-root">
    <header class="st-header">
        <div class="st-header__inner">
            <a href="/" class="st-logo" aria-label="SlopTotal home">
                <svg viewBox="0 0 32 32" aria-hidden="true" focusable="false"><path class="st-logo__drop" d="M16 2.5C16 2.5 6 13.8 6 20a10 10 0 0 0 20 0C26 13.8 16 2.5 16 2.5Z"/><rect class="st-logo__scan" x="1.5" y="17.5" width="29" height="2.6" rx="1.3"/></svg>
                <span class="st-logo__word"><b>Slop</b>Total</span>
            </a>
            <nav class="st-header__nav" aria-label="Main">
                <a href="/"{% if request.url.path == "/" %} aria-current="page"{% endif %}>Detector</a>
                <a href="/docs">API</a>
                <a href="https://github.com/pablocaeg/sloptotal" class="hide-sm">GitHub</a>
            </nav>
        </div>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
    <footer class="st-footer">
        <div class="footer-line">
            <span>Self-hosted SlopTotal. Every engine runs on this server; no text is sent to third parties.</span>
            <span><a href="https://github.com/pablocaeg/sloptotal">Source</a> · MIT licence</span>
        </div>
    </footer>
    {% block scripts %}{% endblock %}
</body>
</html>
