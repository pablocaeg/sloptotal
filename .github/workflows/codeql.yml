name: CodeQL

# Static analysis of the Python API and the JavaScript of the web UI. Findings
# show up under Security > Code scanning.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '41 5 * * 3'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript, actions]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
