name: Claude

# Runs when the maintainer mentions @claude on an issue or pull
# request, for example "@claude fix this" or "@claude review this". It can push
# a branch and open a pull request. Only the maintainer's mentions start it.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    if: >-
      github.actor == 'pablocaeg' && (
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude'))))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    env:
      HAS_CLAUDE_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - if: env.HAS_CLAUDE_TOKEN != 'true'
        run: echo "::notice::CLAUDE_CODE_OAUTH_TOKEN is not set; skipping."

      - if: env.HAS_CLAUDE_TOKEN == 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - if: env.HAS_CLAUDE_TOKEN == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - if: env.HAS_CLAUDE_TOKEN == 'true'
        run: pip install -r requirements-dev.txt

      - if: env.HAS_CLAUDE_TOKEN == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: >-
            --allowedTools "Bash(pytest:*),Bash(ruff:*),Bash(python:*),Bash(gh:*),Bash(git:*)"
