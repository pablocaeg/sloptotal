name: Links

on:
  schedule:
    - cron: '17 6 * * 1'
  pull_request:
    paths:
      - '**/*.md'
      - .github/workflows/links.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: links-${{ github.ref }}
  cancel-in-progress: true

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Broken links are listed in the job summary. fail: false keeps the run green,
      # so this reports and never blocks a merge.
      - uses: lycheeverse/lychee-action@v2
        with:
          fail: false
          args: >-
            --no-progress
            --include-fragments
            --exclude '^https?://localhost'
            --exclude '^https?://127\.0\.0\.1'
            --exclude '^https://sloptotal\.com/report/'
            README.md AGENTS.md 'docs/**/*.md' tests/eval/FINDINGS.md
