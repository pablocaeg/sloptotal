[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sloptotal"
version = "0.1.0"
description = "Detect AI-generated text with 23 engines: a CLI, a Python client and an MCP server for the SlopTotal API."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Pablo Carrasco Egea" }]
keywords = ["ai-detection", "ai-text-detector", "chatgpt-detector", "mcp", "cli", "llm"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = ["httpx>=0.27", "mcp>=2.2"]

[project.scripts]
sloptotal = "sloptotal.cli:main"

[project.urls]
Homepage = "https://sloptotal.com"
Source = "https://github.com/pablocaeg/sloptotal"

[tool.hatch.build.targets.wheel]
packages = ["src/sloptotal"]
